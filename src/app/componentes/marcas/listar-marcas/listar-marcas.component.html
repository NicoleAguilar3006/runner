<div class="container mt-5">
    <h2 class="mb-4">{{titulo}}</h2>
    <a routerLink="/registroMarcas" class="btn btn-outline-primary">
      <i class="fa-solid fa-pen-to-square"></i> Añadir Marca
    </a>
    <br>
    <div *ngIf="cargoLista" class="row gy-4 gx-4">
      <div class="col-md-4 col-sm-6" *ngFor="let marca of marcas.response">
        <div class="card text-center shadow-sm border border-2 rounded-4 p-4 h-100 hover-card">
          <i class="fa-solid fa-shoe-prints fa-rotate-270 fa-4x mb-3" style="color: #000000;"></i>
  
          <div class="mb-3">
            <h2 class="mb-3"><strong>{{marca.nombre}}</strong></h2>
          </div>                 
        </div>
      </div>
    </div>
