<div class="container">
  <h2>Registrar Modelo</h2>

  <div *ngIf="mensajeConfirmacion" class="alert alert-success">
    {{ mensajeConfirmacion }}
  </div>

  <form (ngSubmit)="registrarModelo()" #form="ngForm">
    <div class="mb-3">
      <label for="descripcion" class="form-label">Descripción</label>
      <input 
        type="text" 
        id="descripcion" 
        class="form-control" 
        [(ngModel)]="nuevoModelo.descripcion" 
        name="descripcion" 
        required>
    </div>

    <div class="mb-3">
      <label for="info" class="form-label">Información</label>
      <input 
        type="text" 
        id="info" 
        class="form-control" 
        [(ngModel)]="nuevoModelo.info" 
        name="info" 
        required>
    </div>

    <div class="mb-3">
      <label for="precio" class="form-label">Precio</label>
      <input 
        type="number" 
        id="precio" 
        class="form-control" 
        [(ngModel)]="nuevoModelo.precio" 
        name="precio" 
        required>
    </div>

    <div class="mb-3">
      <label for="categoria" class="form-label">Categoría</label>
      <select 
        id="categoria" 
        class="form-select" 
        [(ngModel)]="nuevoModelo.idCtg" 
        name="idCtg" 
        required>
        <option selected value="0">Seleccione...</option>
        <option *ngFor="let categoria of categorias" [value]="categoria.id">{{ categoria.nombre }}</option>
      </select>
    </div>

    <div class="mb-3">
      <label for="marca" class="form-label">Marca</label>
      <select 
        id="marca" 
        class="form-select" 
        [(ngModel)]="nuevoModelo.idMrc" 
        name="idMrc" 
        required>
        <option selected value="0">Seleccione...</option>
        <option *ngFor="let marca of marcas" [value]="marca.id">{{ marca.nombre }}</option>
      </select>
    </div>

    <div class="mb-3">
      <label for="persona" class="form-label">Persona</label>
      <select 
        id="persona" 
        class="form-select" 
        [(ngModel)]="nuevoModelo.idPrn" 
        name="idPrn" 
        required>
        <option selected value="0">Seleccione...</option>
        <option *ngFor="let persona of personas" [value]="persona.id">{{ persona.nombre }}</option>
      </select>
    </div>

    <div class="mb-3">
      <label for="material" class="form-label">Material</label>
      <select 
        id="material" 
        class="form-select" 
        [(ngModel)]="nuevoModelo.idMtl" 
        name="idMtl" 
        required>
        <option selected value="0">Seleccione...</option>
        <option *ngFor="let material of materiales" [value]="material.id">{{ material.nombre }}</option>
      </select>
    </div>

    <button type="submit" class="btn btn-primary" [disabled]="!form.valid">Registrar</button>
  </form>
</div>
