  <div class="container mt-5">
    <h2 class="mb-4">{{titulo}}</h2>
    <a routerLink="/registroCategorias" class="btn btn-outline-primary">
      <i class="fa-solid fa-pen-to-square"></i> Crear categoría
    </a>
    <br>
    <div *ngIf="cargoLista" class="row gy-4 gx-4">
      <div class="col-md-4 col-sm-6" *ngFor="let categorias of categorias.response">
        <div class="card text-center shadow-sm border border-2 rounded-4 p-4 h-100 hover-card">
          <i class="fa-solid fa-table-list fa-4x mb-3" style="color: #000000;"></i>
          
          <div class="mb-3">
            <h2 class="mb-3"><strong>{{categorias.nombre}}</strong></h2>
          </div>
          <!-- <button class="btn btn-outline-primary btn-sm" (click)="verModelosPorMarca(marca.id)">
            Ver modelos
          </button>  -->                  
        </div>
      </div>
    </div>
  </div>
